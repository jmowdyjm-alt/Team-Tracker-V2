        const INITIAL_EVENTS = [

        const TEAM_MEMBERS = [

            { id: 'tm-2', name: 'Sarah Jenkins', role: 'Senior Technical Coordinator', location: 'Chicago, IL', email: 'sarah.j@teamtravel.com' },
            { id: 'tm-3', name: 'Dr. Marcus Vance', role: 'Director of Client Relations', location: 'Atlanta, GA', email: 'marcus.v@teamtravel.com' },
            { id: 'tm-4', name: 'Elena Rostova', role: 'Logistics & Operations Manager', location: 'New York, NY', email: 'elena.r@teamtravel.com' },

        const INITIAL_TIMEOFF = [
            { id: 'to-1', person: 'Jordan Lee', type: 'PTO', title: 'Vacation', startDate: '2026-11-10', endDate: '2026-11-15' },

        const IconCalendar = () => (

        const IconGantt = () => (

                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />

        const IconUser = () => (

        const IconPlus = () => (

        const IconMapPin = () => (

                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />

        );

        const IconAlert = () => (
            <svg className="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        );

        function App() {
            // State
            const [events, setEvents] = useState(() => {
                const saved = localStorage.getItem('team_travel_events_v7');
                return saved ? JSON.parse(saved) : INITIAL_EVENTS;
            });

            const [timeOffEntries, setTimeOffEntries] = useState(() => {
                const saved = localStorage.getItem('team_travel_timeoff_v7');
                return saved ? JSON.parse(saved) : INITIAL_TIMEOFF;
            });

            const [activeTab, setActiveTab] = useState('events'); // 'events' | 'gantt' | 'workload' | 'profile'
            const [filterFY, setFilterFY] = useState('ALL');
            const [filterStatus, setFilterStatus] = useState('ALL');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedMemberProfile, setSelectedMemberProfile] = useState(TEAM_MEMBERS[0].name);

            // Gantt View Specific States
            const [ganttRangePreset, setGanttRangePreset] = useState('SEP_DEC_2026');
            const [ganttCustomStart, setGanttCustomStart] = useState('2026-09-01');
            const [ganttCustomEnd, setGanttCustomEnd] = useState('2026-12-31');
            const [ganttFY, setGanttFY] = useState('FY27');
            const [ganttGroupBy, setGanttGroupBy] = useState('personnel'); // 'personnel' | 'project'

            // Modal States
            const [isEventModalOpen, setIsEventModalOpen] = useState(false);
            const [editingEvent, setEditingEvent] = useState(null);
            const [isTimeOffModalOpen, setIsTimeOffModalOpen] = useState(false);
            const [isDeleteModalOpen, setIsDeleteModalOpen] = useState(false);
            const [eventToDelete, setEventToDelete] = useState(null);

            // Form state for event
            const [eventFormData, setEventFormData] = useState({
                project: '',
                venue: '',
                city: '',
                state: '',
                startDate: '',
                endDate: '',
                isTBD: false,
                confirmationStatus: 'CONFIRMED',
                fiscalYear: 'FY27',
                team: [],
                notes: ''
            });

            // Form state for time off
            const [timeOffFormData, setTimeOffFormData] = useState({
                person: 'Jordan Lee',
                type: 'PTO',
                title: '',
                startDate: '',
                endDate: ''
            });

            useEffect(() => {
                localStorage.setItem('team_travel_events_v7', JSON.stringify(events));
            }, [events]);

            useEffect(() => {
                localStorage.setItem('team_travel_timeoff_v7', JSON.stringify(timeOffEntries));
            }, [timeOffEntries]);

            const getEventFY = (evt) => {
                if (evt.fiscalYear) return evt.fiscalYear;
                if (!evt.startDate) return 'FY27';
                const d = new Date(evt.startDate);
                const year = d.getFullYear();
                const month = d.getMonth();
                const fyYear = month >= 6 ? (year + 1) % 100 : year % 100;
                return `FY${fyYear}`;
            };

            const getEventMetrics = (evt) => {
                if (evt.isTBD || !evt.startDate || !evt.endDate) {
                    return { travelDays: 0, daysAtSite: 0, weekendDays: 0, status: 'TBD', daysUntil: null };
                }

                const start = new Date(evt.startDate + 'T00:00:00');
                const end = new Date(evt.endDate + 'T00:00:00');
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                const diffTime = Math.abs(end - start);
                const travelDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

                let weekendDays = 0;
                let cur = new Date(start);
                while (cur <= end) {
                    const day = cur.getDay();
                    if (day === 0 || day === 6) weekendDays++;
                    cur.setDate(cur.getDate() + 1);
                }

                const timeToStart = start - today;
                const daysUntil = Math.ceil(timeToStart / (1000 * 60 * 60 * 24));

                let status = 'UPCOMING';
                if (today >= start && today <= end) status = 'IN_PROGRESS';
                else if (today > end) status = 'PAST';

                return { travelDays, daysAtSite: travelDays, weekendDays, status, daysUntil };
            };

            const getCountbackMilestones = (evt) => {
                if (evt.isTBD || !evt.startDate) return [];
                const departure = new Date(evt.startDate + 'T00:00:00');
                
                const offsets = [
                    { label: 'T-60 Days', days: 60, title: 'Venue & Hotel Lock' },
                    { label: 'T-30 Days', days: 30, title: 'Staffing & Flights Finalized' },
                    { label: 'T-14 Days', days: 14, title: 'Freight & AV Logistics' },
                    { label: 'T-7 Days', days: 7, title: 'Final Team Briefing' }
                ];

                const today = new Date();
                today.setHours(0,0,0,0);

                return offsets.map(m => {
                    const milestoneDate = new Date(departure);
                    milestoneDate.setDate(milestoneDate.getDate() - m.days);
                    const isPassed = today >= milestoneDate;
                    return { ...m, dateStr: milestoneDate.toISOString().split('T')[0], isPassed };
                });
            };

            const getEventConflicts = (evt) => {
                if (evt.isTBD || !evt.startDate || !evt.endDate || evt.confirmationStatus === 'CANCELLED') return [];
                const eStart = new Date(evt.startDate + 'T00:00:00');
                const eEnd = new Date(evt.endDate + 'T00:00:00');

                const conflicts = [];

                timeOffEntries.forEach(to => {
                    const toStart = new Date(to.startDate + 'T00:00:00');
                    const toEnd = new Date(to.endDate + 'T00:00:00');

                    if (eStart <= toEnd && eEnd >= toStart) {
                        if (to.person === 'Global') {
                            conflicts.push({ type: 'HOLIDAY', title: `${to.title} (Company Holiday)`, person: 'Global' });
                        } else if (evt.team.includes(to.person)) {
                            conflicts.push({ type: to.type, title: `${to.person}: ${to.title}`, person: to.person });
                        }
                    }
                });

                return conflicts;
            };

            const calendarDaysList = useMemo(() => {
                const list = [];
                const s = new Date(ganttCustomStart + 'T00:00:00');
                const e = new Date(ganttCustomEnd + 'T00:00:00');

                if (isNaN(s.getTime()) || isNaN(e.getTime()) || s > e) return list;

                let cur = new Date(s);
                while (cur <= e) {
                    list.push(new Date(cur));
                    cur.setDate(cur.getDate() + 1);
                }
                return list;
            }, [ganttCustomStart, ganttCustomEnd]);

            const calendarMonthGroups = useMemo(() => {
                const groups = [];
                calendarDaysList.forEach((d) => {
                    const monthName = d.toLocaleString('default', { month: 'short', year: 'numeric' });
                    if (groups.length === 0 || groups[groups.length - 1].monthName !== monthName) {
                        groups.push({ monthName, count: 1 });
                    } else {
                        groups[groups.length - 1].count++;
                    }
                });
                return groups;
            }, [calendarDaysList]);

            const handleApplyPreset = (preset) => {
                setGanttRangePreset(preset);
                if (preset === 'SEP_DEC_2026') {
                    setGanttCustomStart('2026-09-01');
                    setGanttCustomEnd('2026-12-31');
                } else if (preset === 'NEXT_60') {
                    const start = new Date();
                    const end = new Date();
                    end.setDate(end.getDate() + 60);
                    setGanttCustomStart(start.toISOString().split('T')[0]);
                    setGanttCustomEnd(end.toISOString().split('T')[0]);
                } else if (preset === 'NEXT_90') {
                    const start = new Date();
                    const end = new Date();
                    end.setDate(end.getDate() + 90);
                    setGanttCustomStart(start.toISOString().split('T')[0]);
                    setGanttCustomEnd(end.toISOString().split('T')[0]);
                } else if (preset === 'FULL_FY') {
                    if (ganttFY === 'FY27') {
                        setGanttCustomStart('2026-07-01');
                        setGanttCustomEnd('2027-06-30');
                    } else if (ganttFY === 'FY28') {
                        setGanttCustomStart('2027-07-01');
                        setGanttCustomEnd('2028-06-30');
                    } else if (ganttFY === 'FY29') {
                        setGanttCustomStart('2028-07-01');
                        setGanttCustomEnd('2029-06-30');
                    } else {
                        setGanttCustomStart('2025-07-01');
                        setGanttCustomEnd('2026-06-30');
                    }
                }
            };

            const getDayRangePlacement = (startDateStr, endDateStr) => {
                if (!calendarDaysList.length || !startDateStr || !endDateStr) return null;

                const gridStart = calendarDaysList[0].getTime();
                const gridEnd = calendarDaysList[calendarDaysList.length - 1].getTime() + 86400000;
                const totalGridMs = gridEnd - gridStart;

                const eStart = new Date(startDateStr + 'T00:00:00').getTime();
                const eEnd = new Date(endDateStr + 'T23:59:59').getTime();

                if (eEnd < gridStart || eStart > gridEnd) return null;

                const clampedStart = Math.max(eStart, gridStart);
                const clampedEnd = Math.min(eEnd, gridEnd);

                const leftPercent = ((clampedStart - gridStart) / totalGridMs) * 100;
                const widthPercent = Math.max(1.2, ((clampedEnd - clampedStart) / totalGridMs) * 100);

                return { leftPercent, widthPercent };
            };

            const openAddEventModal = () => {
                setEditingEvent(null);
                setEventFormData({
                    project: '',
                    venue: '',
                    city: '',
                    state: '',
                    startDate: '',
                    endDate: '',
                    isTBD: false,
                    confirmationStatus: 'CONFIRMED',
                    fiscalYear: filterFY !== 'ALL' ? filterFY : 'FY27',
                    team: [],
                    notes: ''
                });
                setIsEventModalOpen(true);
            };

            const openEditEventModal = (evt) => {
                setEditingEvent(evt);
                setEventFormData({
                    project: evt.project || '',
                    venue: evt.venue || '',
                    city: evt.city || '',
                    state: evt.state || '',
                    startDate: evt.startDate || '',
                    endDate: evt.endDate || '',
                    isTBD: evt.isTBD || false,
                    confirmationStatus: evt.confirmationStatus || 'CONFIRMED',
                    fiscalYear: getEventFY(evt),
                    team: [...(evt.team || [])],
                    notes: evt.notes || ''
                });
                setIsEventModalOpen(true);
            };

            const saveEvent = (e) => {
                e.preventDefault();
                if (!eventFormData.project) return;

                if (editingEvent) {
                    setEvents(events.map(item => item.id === editingEvent.id ? { ...eventFormData, id: editingEvent.id } : item));
                } else {
                    const newEvt = {
                        ...eventFormData,
                        id: `evt-${Date.now()}`
                    };
                    setEvents([...events, newEvt]);
                }
                setIsEventModalOpen(false);
            };

            const confirmDeleteEvent = (evt) => {
                setEventToDelete(evt);
                setIsDeleteModalOpen(true);
            };

            const executeDeleteEvent = () => {
                if (eventToDelete) {
                    setEvents(events.filter(e => e.id !== eventToDelete.id));
                    setEventToDelete(null);
                    setIsDeleteModalOpen(false);
                }
            };

            const filteredEvents = useMemo(() => {
                return events.filter(e => {
                    const matchFY = filterFY === 'ALL' || getEventFY(e) === filterFY;
                    const matchStatus = filterStatus === 'ALL' || e.confirmationStatus === filterStatus;
                    const q = searchQuery.toLowerCase();
                    const matchQuery = !q || 
                        e.project.toLowerCase().includes(q) || 
                        e.venue.toLowerCase().includes(q) || 
                        e.city.toLowerCase().includes(q) ||
                        e.team.some(t => t.toLowerCase().includes(q));
                    return matchFY && matchStatus && matchQuery;
                });
            }, [events, filterFY, filterStatus, searchQuery]);

            return (
                <div className="min-h-full flex flex-col bg-slate-950 text-slate-100">
                    <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-xl">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <div className="flex items-center gap-3">
                                    <div className="bg-gradient-to-tr from-indigo-600 to-indigo-400 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-500/20">
                                        <IconCalendar />
                                    </div>
                                    <div>
                                        <h1 className="text-lg font-extrabold text-white tracking-tight flex items-center gap-2">
                                            Team Travel Tracker
                                            <span className="text-[10px] bg-indigo-500/20 text-indigo-300 font-mono font-semibold px-2 py-0.5 rounded-full border border-indigo-500/30">
                                                Multi-FY Hub
                                            </span>
                                        </h1>
                                        <p className="text-xs text-slate-400">Project Travel, On-Site Days & Schedule Planning</p>
                                    </div>
                                </div>

                                <nav className="flex items-center bg-slate-950/80 p-1.5 rounded-xl border border-slate-800 space-x-1">
                                    <button
                                        onClick={() => setActiveTab('events')}
                                        className={`flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${
                                            activeTab === 'events' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'
                                        }`}
                                    >
                                        <IconCalendar /> All Events ({events.length})
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('gantt')}
                                        className={`flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${
                                            activeTab === 'gantt' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'
                                        }`}
                                    >
                                        <IconGantt /> Gantt Timeline
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('workload')}
                                        className={`flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${
                                            activeTab === 'workload' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'
                                        }`}
                                    >
                                        <IconUsers /> Team Workload
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('profile')}
                                        className={`flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${
                                            activeTab === 'profile' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'
                                        }`}
                                    >
                                        <IconUser /> Member Profiles
                                    </button>
                                </nav>

                                <button
                                    onClick={openAddEventModal}
                                    className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-4 py-2 rounded-xl flex items-center gap-2 shadow-lg shadow-indigo-600/30 transition transform active:scale-95"
                                >
                                    <IconPlus /> Add Event

                                        <p className="text-xs text-slate-400">Total days on site, weekend travel impact, and recorded leave</p>
                                    </div>
                                    <button
                                        onClick={() => setIsTimeOffModalOpen(true)}
                                        className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-indigo-300 font-bold text-xs px-3.5 py-2 rounded-xl flex items-center gap-1.5 transition"
                                    >
                                        <IconPlus /> Log Time-Off / Holiday
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                    {TEAM_MEMBERS.map(member => {
                                        const assignedEvts = events.filter(e => 
                                            e.team.includes(member.name) && 
                                            e.confirmationStatus !== 'CANCELLED' &&
                                            (filterFY === 'ALL' || getEventFY(e) === filterFY)
                                        );

                                        let totalDaysOnSite = 0;
                                        let totalWeekendDays = 0;

                                        assignedEvts.forEach(e => {
                                            const m = getEventMetrics(e);
                                            totalDaysOnSite += m.daysAtSite;
                                            totalWeekendDays += m.weekendDays;
                                        });

                                        const memberLeave = timeOffEntries.filter(to => to.person === member.name || to.person === 'Global');

                                        return (
                                            <div key={member.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                                                <div>
                                                    <div className="flex items-center justify-between mb-3">
                                                        <div className="flex items-center gap-3">
                                                            <div className="w-10 h-10 rounded-full bg-indigo-600/30 text-indigo-300 border border-indigo-500/40 font-bold flex items-center justify-center text-sm">
                                                                {member.name.split(' ').map(n=>n[0]).join('')}
                                                            </div>
                                                            <div>
                                                                <h3 className="font-extrabold text-white text-sm">{member.name}</h3>
                                                                <p className="text-xs text-slate-400">{member.role}</p>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div className="grid grid-cols-3 gap-2 bg-slate-950 p-3 rounded-xl border border-slate-800 text-center my-3">
                                                        <div>
                                                            <span className="text-[10px] text-slate-500 uppercase font-bold block">Shows</span>
                                                            <span className="text-base font-extrabold text-indigo-300">{assignedEvts.length}</span>
                                                        </div>
                                                        <div>
                                                            <span className="text-[10px] text-slate-500 uppercase font-bold block">Site Days</span>
                                                            <span className="text-base font-extrabold text-emerald-400">{totalDaysOnSite}d</span>
                                                        </div>
                                                        <div>
                                                            <span className="text-[10px] text-slate-500 uppercase font-bold block">Weekends</span>
                                                            <span className="text-base font-extrabold text-amber-400">{totalWeekendDays}d</span>
                                                        </div>
                                                    </div>

                                                    <div className="space-y-1.5 mt-3">
                                                        <span className="text-[10px] text-slate-400 uppercase font-bold block">Recorded Leave / Holidays:</span>
                                                        {memberLeave.length === 0 ? (
                                                            <p className="text-xs text-slate-500 italic">No leave recorded</p>
                                                        ) : (
                                                            memberLeave.map(to => (
                                                                <div key={to.id} className="bg-slate-950/80 px-2.5 py-1.5 rounded-lg border border-slate-800 text-xs flex items-center justify-between">
                                                                    <span className="font-semibold text-slate-300">{to.title} ({to.type})</span>
                                                                    <span className="font-mono text-[10px] text-indigo-300">{to.startDate} → {to.endDate}</span>
                                                                </div>
                                                            ))
                                                        )}
                                                    </div>
                                                </div>

                                                <button
                                                    onClick={() => {
                                                        setSelectedMemberProfile(member.name);
                                                        setActiveTab('profile');
                                                    }}
                                                    className="mt-4 w-full bg-slate-800 hover:bg-slate-700 text-xs font-bold text-indigo-300 py-2 rounded-xl transition border border-slate-700"
                                                >
                                                    View Detailed Member Profile →
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'profile' && (
                            <div className="space-y-6">
                                <div className="flex items-center gap-2 overflow-x-auto pb-2 border-b border-slate-800 custom-scrollbar">
                                    {TEAM_MEMBERS.map(m => (
                                        <button
                                            key={m.id}
                                            onClick={() => setSelectedMemberProfile(m.name)}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold transition shrink-0 ${
                                                selectedMemberProfile === m.name ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'
                                            }`}
                                        >
                                            {m.name}
                                        </button>
                                    ))}
                                </div>

                                {(() => {
                                    const member = TEAM_MEMBERS.find(m => m.name === selectedMemberProfile) || TEAM_MEMBERS[0];
                                    const memberEvents = events.filter(e => e.team.includes(member.name));
                                    const memberLeave = timeOffEntries.filter(to => to.person === member.name || to.person === 'Global');

                                    let totalSiteDays = 0;
                                    let totalWeekendDays = 0;
                                    memberEvents.forEach(e => {
                                        if (e.confirmationStatus !== 'CANCELLED') {
                                            const m = getEventMetrics(e);
                                            totalSiteDays += m.daysAtSite;
                                            totalWeekendDays += m.weekendDays;
                                        }
                                    });

                                    return (
                                        <div className="space-y-6">
                                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                                                <div className="flex items-center gap-4">
                                                    <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-indigo-400 text-white font-extrabold text-xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
                                                        {member.name.split(' ').map(n=>n[0]).join('')}
                                                    </div>
                                                    <div>
                                                        <h2 className="text-xl font-extrabold text-white">{member.name}</h2>
                                                        <p className="text-xs text-indigo-300 font-semibold">{member.role} • {member.location}</p>
                                                        <p className="text-xs text-slate-400 font-mono mt-1">{member.email}</p>
                                                    </div>
                                                </div>

                                                <div className="flex items-center gap-3">
                                                    <div className="bg-slate-950 px-4 py-3 rounded-xl border border-slate-800 text-center">
                                                        <span className="text-[10px] text-slate-400 uppercase font-bold block">Assigned Shows</span>
                                                        <span className="text-lg font-extrabold text-white">{memberEvents.length}</span>
                                                    </div>
                                                    <div className="bg-slate-950 px-4 py-3 rounded-xl border border-slate-800 text-center">
                                                        <span className="text-[10px] text-slate-400 uppercase font-bold block">Site Days</span>
                                                        <span className="text-lg font-extrabold text-emerald-400">{totalSiteDays}d</span>
                                                    </div>
                                                    <div className="bg-slate-950 px-4 py-3 rounded-xl border border-slate-800 text-center">
                                                        <span className="text-[10px] text-slate-400 uppercase font-bold block">Weekend Days</span>
                                                        <span className="text-lg font-extrabold text-amber-400">{totalWeekendDays}d</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                                                <h3 className="text-sm font-bold text-white uppercase tracking-wider">Show Travel Ledger ({memberEvents.length})</h3>
                                                <div className="divide-y divide-slate-800">
                                                    {memberEvents.map(e => {
                                                        const m = getEventMetrics(e);

                                                        return (
                                                            <div key={e.id} className="py-3 flex flex-col md:flex-row md:items-center justify-between gap-3">
                                                                <div>
                                                                    <div className="flex items-center gap-2">
                                                                        <span className="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-[10px] font-mono px-2 py-0.5 rounded font-bold">
                                                                            {getEventFY(e)}
                                                                        </span>
                                                                        <h4 className="font-extrabold text-white text-sm">{e.project}</h4>
                                                                    </div>
                                                                    <p className="text-xs text-slate-400 mt-0.5">{e.venue} • {e.city}, {e.state}</p>
                                                                </div>

                                                                <div className="flex items-center gap-4">
                                                                    <div className="text-right">
                                                                        <span className="font-mono text-xs text-indigo-200 font-bold block">{e.startDate} → {e.endDate}</span>
                                                                        <span className="text-[11px] text-slate-400">{m.daysAtSite} Site Days ({m.weekendDays} Weekend)</span>
                                                                    </div>
                                                                    <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full border ${
                                                                        e.confirmationStatus === 'CANCELLED' ? 'bg-rose-950/80 text-rose-300 border-rose-800' : 'bg-emerald-950/80 text-emerald-300 border-emerald-800'
                                                                    }`}>
                                                                        {e.confirmationStatus || 'CONFIRMED'}
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        )}
                    </main>

                    {}
                    {isEventModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                                <h3 className="text-lg font-bold text-white">{editingEvent ? 'Edit Travel Event' : 'Add New Travel Event'}</h3>
                                <form onSubmit={saveEvent} className="space-y-3">
                                    <div>
                                        <label className="text-xs text-slate-400 font-semibold block mb-1">Project Name</label>
                                        <input
                                            type="text"
                                            required
                                            value={eventFormData.project}
                                            onChange={e => setEventFormData({...eventFormData, project: e.target.value})}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                                            placeholder="e.g. Apex Retail Summit"
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs text-slate-400 font-semibold block mb-1">Venue</label>
                                            <input
                                                type="text"
                                                value={eventFormData.venue}
                                                onChange={e => setEventFormData({...eventFormData, venue: e.target.value})}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-400 font-semibold block mb-1">City, State</label>
                                            <input
                                                type="text"
                                                value={`${eventFormData.city}${eventFormData.state ? ', ' + eventFormData.state : ''}`}
                                                onChange={e => {
                                                    const parts = e.target.value.split(',');
                                                    setEventFormData({
                                                        ...eventFormData, 
                                                        city: parts[0] ? parts[0].trim() : '', 
                                                        state: parts[1] ? parts[1].trim() : ''
                                                    });
                                                }}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                                                placeholder="Nashville, TN"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs text-slate-400 font-semibold block mb-1">Start Date</label>
                                            <input
                                                type="date"
                                                value={eventFormData.startDate}
                                                onChange={e => setEventFormData({...eventFormData, startDate: e.target.value})}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-sm text-indigo-300 font-mono focus:outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-400 font-semibold block mb-1">End Date</label>
                                            <input
                                                type="date"
                                                value={eventFormData.endDate}
                                                onChange={e => setEventFormData({...eventFormData, endDate: e.target.value})}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-sm text-indigo-300 font-mono focus:outline-none"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs text-slate-400 font-semibold block mb-1">Fiscal Year</label>
                                            <select
                                                value={eventFormData.fiscalYear}
                                                onChange={e => setEventFormData({...eventFormData, fiscalYear: e.target.value})}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none"
                                            >
                                                <option value="FY26">FY26</option>
                                                <option value="FY27">FY27</option>
                                                <option value="FY28">FY28</option>
                                                <option value="FY29">FY29</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-400 font-semibold block mb-1">Confirmation Status</label>
                                            <select
                                                value={eventFormData.confirmationStatus}
                                                onChange={e => setEventFormData({...eventFormData, confirmationStatus: e.target.value})}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none"
                                            >
                                                <option value="CONFIRMED">CONFIRMED</option>
                                                <option value="UNCONFIRMED">UNCONFIRMED</option>
                                                <option value="CANCELLED">CANCELLED</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs text-slate-400 font-semibold block mb-1.5">Assign Team Members</label>
                                        <div className="grid grid-cols-2 gap-2 bg-slate-950 p-3 rounded-xl border border-slate-800">
                                            {TEAM_MEMBERS.map(m => {
                                                const checked = eventFormData.team.includes(m.name);
                                                return (
                                                    <label key={m.id} className="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                                                        <input
                                                            type="checkbox"
                                                            checked={checked}
                                                            onChange={e => {
                                                                if (e.target.checked) {
                                                                    setEventFormData({...eventFormData, team: [...eventFormData.team, m.name]});
                                                                } else {
                                                                    setEventFormData({...eventFormData, team: eventFormData.team.filter(t => t !== m.name)});
                                                                }
                                                            }}
                                                            className="rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-0"
                                                        />
                                                        {m.name}
                                                    </label>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="flex items-center justify-end gap-3 pt-3">
                                        <button
                                            type="button"
                                            onClick={() => setIsEventModalOpen(false)}
                                            className="px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="submit"
                                            className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-lg"
                                        >
                                            Save Event
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {}
                    {isTimeOffModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                                <h3 className="text-lg font-bold text-white">Log Time-Off or Holiday Block</h3>
                                <form
                                    onSubmit={(e) => {
                                        e.preventDefault();
                                        if (!timeOffFormData.title || !timeOffFormData.startDate) return;
                                        setTimeOffEntries([...timeOffEntries, { ...timeOffFormData, id: `to-${Date.now()}` }]);
                                        setIsTimeOffModalOpen(false);
                                    }}
                                    className="space-y-3"
                                >
                                    <div>
                                        <label className="text-xs text-slate-400 font-semibold block mb-1">Target Individual / Scope</label>
                                        <select
                                            value={timeOffFormData.person}
                                            onChange={e => setTimeOffFormData({...timeOffFormData, person: e.target.value})}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none"
                                        >
                                            <option value="Global">Global / Entire Team (Holiday)</option>
                                            {TEAM_MEMBERS.map(m => (
                                                <option key={m.id} value={m.name}>{m.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="text-xs text-slate-400 font-semibold block mb-1">Leave Type & Title</label>
                                        <div className="grid grid-cols-3 gap-2 mb-2">
                                            {['PTO', 'HOLIDAY', 'NO_TRAVEL'].map(t => (
                                                <button
                                                    key={t}
                                                    type="button"
                                                    onClick={() => setTimeOffFormData({...timeOffFormData, type: t})}
                                                    className={`py-1.5 rounded-lg text-xs font-bold transition ${
                                                        timeOffFormData.type === t ? 'bg-indigo-600 text-white' : 'bg-slate-950 text-slate-400'
                                                    }`}
                                                >
                                                    {t}
                                                </button>
                                            ))}
                                        </div>
                                        <input
                                            type="text"
                                            required
                                            value={timeOffFormData.title}
                                            onChange={e => setTimeOffFormData({...timeOffFormData, title: e.target.value})}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none"
                                            placeholder="e.g. Personal Vacation / Thanksgiving"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs text-slate-400 font-semibold block mb-1">Start Date</label>
                                            <input
                                                type="date"
                                                required
                                                value={timeOffFormData.startDate}
                                                onChange={e => setTimeOffFormData({...timeOffFormData, startDate: e.target.value})}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-sm text-indigo-300 font-mono focus:outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-400 font-semibold block mb-1">End Date</label>
                                            <input
                                                type="date"
                                                required
                                                value={timeOffFormData.endDate}
                                                onChange={e => setTimeOffFormData({...timeOffFormData, endDate: e.target.value})}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-sm text-indigo-300 font-mono focus:outline-none"
                                            />
                                        </div>
                                    </div>

                                    <div className="flex items-center justify-end gap-3 pt-3">
                                        <button
                                            type="button"
                                            onClick={() => setIsTimeOffModalOpen(false)}
                                            className="px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="submit"
                                            className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-lg"
                                        >
                                            Save Time-Off
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {}
                    {isDeleteModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4 text-center">
                                <h3 className="text-base font-bold text-white">Delete Travel Event?</h3>
                                <p className="text-xs text-slate-400">
                                    Are you sure you want to remove <span className="text-white font-bold">{eventToDelete?.project}</span>?
                                </p>
                                <div className="flex items-center justify-center gap-3 pt-2">
                                    <button
                                        onClick={() => setIsDeleteModalOpen(false)}
                                        className="px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white bg-slate-800"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={executeDeleteEvent}
                                        className="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-lg"
                                    >
                                        Yes, Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
